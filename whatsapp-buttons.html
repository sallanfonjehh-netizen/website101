<!-- WhatsApp Floating Buttons -->

<style>
    /* WhatsApp Floating Buttons */
    .whatsapp-buttons-container {
        position: fixed;
        bottom: 30px;
        right: 30px;
        z-index: 40;
        display: flex;
        flex-direction: column;
        gap: 15px;
    }

    .whatsapp-btn {
        width: 65px;
        height: 65px;
        border-radius: 50%;
        background: #25D366;
        display: flex;
        align-items: center;
        justify-content: center;
        text-decoration: none;
        box-shadow: 0 4px 12px rgba(37, 211, 102, 0.4);
        transition: all 0.3s ease;
        cursor: pointer;
        border: none;
        font-size: 32px;
    }

    .whatsapp-btn:hover {
        background: #20ba5a;
        box-shadow: 0 6px 16px rgba(37, 211, 102, 0.6);
        transform: scale(1.1);
    }

    .whatsapp-btn:active {
        transform: scale(0.95);
    }

    /* Left side button */
    .whatsapp-btn-left {
        position: fixed;
        bottom: 30px;
        left: 30px;
        width: 65px;
        height: 65px;
        border-radius: 50%;
        background: #25D366;
        display: flex;
        align-items: center;
        justify-content: center;
        text-decoration: none;
        box-shadow: 0 4px 12px rgba(37, 211, 102, 0.4);
        transition: all 0.3s ease;
        z-index: 40;
    }

    .whatsapp-btn-left:hover {
        background: #20ba5a;
        box-shadow: 0 6px 16px rgba(37, 211, 102, 0.6);
        transform: scale(1.1);
    }

    .whatsapp-btn-left:active {
        transform: scale(0.95);
    }

    /* Tooltip */
    .whatsapp-tooltip {
        position: absolute;
        background: #333;
        color: #fff;
        padding: 8px 12px;
        border-radius: 6px;
        font-size: 12px;
        white-space: nowrap;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.3s ease;
        z-index: 50;
        font-family: Arial, sans-serif;
    }

    .whatsapp-btn:hover .whatsapp-tooltip,
    .whatsapp-btn-left:hover .whatsapp-tooltip {
        opacity: 1;
    }

    /* Right side tooltips */
    .whatsapp-btn .whatsapp-tooltip {
        right: 85px;
        top: 50%;
        transform: translateY(-50%);
    }

    /* Left side tooltip */
    .whatsapp-btn-left .whatsapp-tooltip {
        left: 85px;
        top: 50%;
        transform: translateY(-50%);
    }

    /* Mobile responsive */
    @media (max-width: 768px) {
        .whatsapp-buttons-container,
        .whatsapp-btn-left {
            bottom: 20px;
            right: 20px;
            left: 20px;
        }

        .whatsapp-btn,
        .whatsapp-btn-left {
            width: 60px;
            height: 60px;
            font-size: 28px;
        }

        .whatsapp-tooltip {
            font-size: 11px;
            padding: 6px 10px;
        }
    }

    @media (max-width: 480px) {
        .whatsapp-buttons-container {
            bottom: 15px;
            right: 15px;
            gap: 12px;
        }

        .whatsapp-btn-left {
            bottom: 15px;
            left: 15px;
        }

        .whatsapp-btn,
        .whatsapp-btn-left {
            width: 55px;
            height: 55px;
            font-size: 24px;
        }

        .whatsapp-tooltip {
            display: none;
        }
    }

    /* Animation for button appearance */
    @keyframes slideInUp {
        from {
            opacity: 0;
            transform: translateY(20px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .whatsapp-btn,
    .whatsapp-btn-left {
        animation: slideInUp 0.5s ease;
    }
</style>
